[package]
name = "sparkline-daemon"
version = "0.1.0"
edition = "2021"
authors = ["mourad"]
description = "Ultra-low-overhead telemetry daemon for GNOME Shell sparkline panel"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
nvml-wrapper = { version = "0.10", optional = true }

[features]
default = ["nvidia"]
nvidia = ["dep:nvml-wrapper"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
